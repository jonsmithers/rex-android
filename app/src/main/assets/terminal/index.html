<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<link rel="stylesheet" href="xterm.css">
<style>
  html, body { margin: 0; height: 100%; background: #1d1f21; overflow: hidden; }
  body { display: flex; flex-direction: column; }
  #term { flex: 1; min-height: 0; padding: 2px 0 0 2px; }
  #status { position: absolute; top: 8px; right: 8px; z-index: 10; display: none;
            font: 12px sans-serif; color: #fff; background: rgba(0,0,0,.6);
            padding: 4px 8px; border-radius: 4px; }
  #keys { display: flex; flex: none; background: #2a2c2e; border-top: 1px solid #000;
          overflow-x: auto; -webkit-user-select: none; user-select: none; }
  #keys button { flex: 1 0 auto; min-width: 44px; height: 40px; border: 0; margin: 0;
                 background: transparent; color: #ddd; font: 15px monospace; }
  #keys button:active, #keys button.on { background: #4a6fa5; color: #fff; }
</style>
</head>
<body>
<div id="status"></div>
<div id="term"></div>
<div id="keys">
  <button data-k="esc">Esc</button>
  <button data-k="tab">Tab</button>
  <button data-k="ctrl" id="ctrl">Ctrl</button>
  <button data-k="left">←</button>
  <button data-k="up">↑</button>
  <button data-k="down">↓</button>
  <button data-k="right">→</button>
  <button data-k="|">|</button>
  <button data-k="~">~</button>
  <button data-k="/">/</button>
  <button data-k="-">-</button>
</div>
<script src="xterm.js"></script>
<script src="addon-fit.js"></script>
<script>
(function () {
  const bridge = window.RexBridge; // Provided by the app.
  const term = new Terminal({
    fontFamily: 'monospace',
    fontSize: 13,
    scrollback: 5000,
    cursorBlink: true,
    allowProposedApi: true,
    disableStdin: true,
    theme: { background: '#1d1f21' },
  });
  const fit = new FitAddon.FitAddon();
  term.loadAddon(fit);
  term.open(document.getElementById('term'));

  // The app owns the keyboard (see TermWebView); xterm.js only draws. With
  // stdin disabled, xterm.js also won't answer terminal queries itself:
  // the server's terminal already does.
  let ctrl = false;
  const ctrlBtn = document.getElementById('ctrl');
  function setCtrl(on) { ctrl = on; ctrlBtn.classList.toggle('on', on); }

  function send(data) { if (bridge && data) bridge.onInput(data); }

  function type(data) {
    if (ctrl && data.length === 1) {
      const c = data.toUpperCase().charCodeAt(0);
      if (c >= 64 && c <= 95) data = String.fromCharCode(c - 64);      // @A-Z[\]^_
      else if (data === ' ') data = '\x00';
      else if (data === '?') data = '\x7f';
      setCtrl(false);
    }
    send(data);
  }

  function key(name) {
    const app = term.modes.applicationCursorKeysMode;
    const arrows = { up: 'A', down: 'B', right: 'C', left: 'D', home: 'H', end: 'F' };
    if (arrows[name]) send((app ? '\x1bO' : '\x1b[') + arrows[name]);
  }

  document.getElementById('keys').addEventListener('click', function (e) {
    const b = e.target.closest('button');
    if (!b) return;
    const k = b.dataset.k;
    if (k === 'ctrl') setCtrl(!ctrl);
    else if (k === 'esc') send('\x1b');
    else if (k === 'tab') send('\t');
    else if (['up', 'down', 'left', 'right'].includes(k)) key(k);
    else type(k);
  });

  // Tap the terminal (without scrolling) to bring up the keyboard.
  let touchY = null;
  const termEl = document.getElementById('term');
  termEl.addEventListener('touchstart', function (e) { touchY = e.touches[0].clientY; }, { passive: true });
  termEl.addEventListener('touchend', function (e) {
    const dy = touchY == null ? 0 : Math.abs(e.changedTouches[0].clientY - touchY);
    if (dy < 10 && bridge) bridge.showKeyboard();
    touchY = null;
  });

  function b64ToBytes(b64) {
    const s = atob(b64);
    const out = new Uint8Array(s.length);
    for (let i = 0; i < s.length; i++) out[i] = s.charCodeAt(i);
    return out;
  }

  let reportTimer = null;
  function reportSize() {
    clearTimeout(reportTimer);
    reportTimer = setTimeout(function () {
      const d = fit.proposeDimensions();
      if (d && d.cols > 0 && d.rows > 0 && bridge) bridge.onSize(d.cols, d.rows);
    }, 150);
  }
  new ResizeObserver(reportSize).observe(document.getElementById('term'));

  function hex(c) { return c && c[0] !== '#' ? '#' + c : c; }
  const ANSI = ['black', 'red', 'green', 'yellow', 'blue', 'magenta', 'cyan', 'white',
    'brightBlack', 'brightRed', 'brightGreen', 'brightYellow', 'brightBlue',
    'brightMagenta', 'brightCyan', 'brightWhite'];

  // Called by the app.
  window.rex = {
    write: function (b64) { term.write(b64ToBytes(b64)); },
    reset: function (vt) { term.reset(); term.write(vt); },
    resize: function (cols, rows) {
      if (cols > 0 && rows > 0 && (cols !== term.cols || rows !== term.rows)) term.resize(cols, rows);
    },
    theme: function (t) {
      const theme = {};
      if (t.foreground) theme.foreground = hex(t.foreground);
      if (t.background) { theme.background = hex(t.background); document.body.style.background = theme.background; }
      if (t.cursor) theme.cursor = hex(t.cursor);
      const ext = [];
      (t.palette || []).forEach(function (p) {
        const [i, c] = p.split('=');
        const idx = parseInt(i, 10);
        if (idx < 16) theme[ANSI[idx]] = hex(c);
        else if (idx < 256) ext[idx - 16] = hex(c);
      });
      if (ext.length) theme.extendedAnsi = ext;
      term.options.theme = theme;
    },
    status: function (text) {
      const el = document.getElementById('status');
      el.textContent = text || '';
      el.style.display = text ? 'block' : 'none';
    },
    type: type,
    key: key,
    notice: function (text) { term.write('\r\n\x1b[7m ' + text + ' \x1b[0m\r\n'); },
  };

  reportSize();
  if (bridge) bridge.onReady();
})();
</script>
</body>
</html>
